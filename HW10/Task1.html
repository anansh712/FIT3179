<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Days of Physical Activity per Week by Age Group (Australia, ABS 2022)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#fafafa; }
    main { max-width:1000px; margin:20px auto 40px; padding:0 16px; }
    #vis { min-height:560px; }
    footer { text-align:center; font-size:0.9rem; color:#555; margin-top:14px; }
  </style>
</head>
<body>
  <main>
    <h1>Days of Physical Activity per Week by Age Group (Australia)</h1>
    <p style="font-size:1rem; color:#444; margin-top:-10px; margin-bottom:12px;">
      Percentage of people in each age group who reported different numbers of days of physical activity in a typical week.
    </p>

    <div id="vis"></div>

    <footer>Source: Australian Bureau of Statistics (ABS), 2022 – Physical Activity</footer>
  </main>

  <script>
    const CSV_URL = "https://raw.githubusercontent.com/anansh712/FIT3179/main/datasets/NumberofdaysofphysicalactivitybyAge.csv";

    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 780,
      "height": 420,
      "data": { "url": CSV_URL },

      /* Interactivity; dropdown filter */
      "params": [
        {
          "name": "dayFilter",
          "value": "All",
          "bind": {
            "input": "select",
            "options": ["All","None","1–4","5–6","7","5 or more"],
            "name": "Days per week: "
          }
        }
      ],

      "transform": [
        /* Handle possible 'Days ' header spacing */
        { "calculate": "trim(datum['Days'] || datum['Days '])", "as": "DaysClean" },

        /* Keep all rows when 'All' is chosen, otherwise filter to the selected category */
        { "filter": "dayFilter == 'All' || datum.DaysClean == dayFilter" },

        /* Fold wide age columns to long format for grouped bars */
        {
          "fold": ["15–17","18–24","25–34","35–44","45–54","55–64","65 years and over"],
          "as": ["AgeGroup","Percent"]
        }
      ],

      "layer": [
        /* Bars */
        {
          "mark": { "type": "bar", "cornerRadiusEnd": 3 },
          "encoding": {
            "x": {
              "field": "AgeGroup",
              "type": "nominal",
              "title": "Age group",
              "axis": { "labelAngle": 0 }
            },
            "xOffset": { "field": "DaysClean" },
            "y": {
              "field": "Percent",
              "type": "quantitative",
              "title": "Percent (%)",
              "axis": { "format": ".0f", "grid": true }
            },
            "color": {
              "field": "DaysClean",
              "type": "nominal",
              "title": "Days per week",
              "scale": { "scheme": "tableau10" }
            },
            "tooltip": [
              { "field": "AgeGroup", "title": "Age group" },
              { "field": "DaysClean", "title": "Days per week" },
              { "field": "Percent", "type": "quantitative", "title": "Percent", "format": ".1f" }
            ]
          }
        },

        /* Annotation */
        {
        "mark": {
            "type": "text",
            "align": "left",
            "font": "Arial",
            "fontStyle": "normal",
            "fontSize": 12,
            "color": "#444",
            "dx": 10,
            "dy": 14
        },
        "encoding": {
            "x": { "value": 0 },             // left edge of the plot
            "y": { "value": 0 },             // top edge of the plot
            "text": {
            "value": "Key insight: The 18-24 age group has the lowest proportion of 'None', indicating most adults in this group engage in some physical activity."
            }
        }
        }
      ]
    };

    vegaEmbed("#vis", spec, { actions: true });
  </script>
</body>
</html>
